<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One4One</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-base:#0F0F13;
    --bg-surface:#18181E;
    --accent-you:#FF5C7A;
    --accent-you-dim:rgba(255,92,122,.16);
    --accent-stranger:#34D6B4;
    --accent-stranger-dim:rgba(52,214,180,.14);
    --text-primary:#F4F2EF;
    --text-muted:#8C8B99;
    --border-subtle:rgba(244,242,239,0.09);
    --danger:#E8433D;
    --warn:#E8B93D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg-base);color:var(--text-primary);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{max-width:480px;margin:0 auto;padding:20px;}

  .app-header{margin-bottom:18px;}
  .logo{
    font-family:'Fraunces',serif;font-style:italic;font-weight:500;
    font-size:22px;letter-spacing:-.01em;margin:0 0 6px;
  }
  .status-row{display:flex;align-items:center;gap:8px;}
  .status-dot{
    width:7px;height:7px;border-radius:50%;background:var(--text-muted);
    flex:0 0 auto;transition:background .2s ease;
  }
  .status-dot.waiting{background:var(--warn);}
  .status-dot.connected{background:var(--accent-stranger);}
  .status-dot.error{background:var(--danger);}
  .status{color:var(--text-muted);font-size:13px;}

  .mode-select{display:flex;gap:8px;margin-bottom:14px;}
  .mode-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--bg-surface);border:1px solid var(--border-subtle);
    color:var(--text-muted);padding:9px 14px;border-radius:100px;
    font-size:13px;font-weight:600;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .mode-btn.selected{background:var(--accent-you);color:#1a0b0e;border-color:var(--accent-you);}

  .voice-ui{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:220px;margin-bottom:16px;background:var(--bg-surface);
    border:1px solid var(--border-subtle);border-radius:16px;padding:24px;
  }
  .voice-ui[hidden]{display:none;}
  .voice-avatar-wrap{position:relative;width:120px;height:120px;margin-bottom:18px;}
  .pulse-ring{
    position:absolute;inset:0;border-radius:50%;
    border:1.5px solid var(--accent-stranger);
    animation:ringPulse 2.2s ease-out infinite;
  }
  .pulse-ring.delay{animation-delay:1.1s;}
  @keyframes ringPulse{
    0%{transform:scale(.6);opacity:.9;}
    100%{transform:scale(1.15);opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){ .pulse-ring{animation:none;} }
  .voice-avatar{
    position:absolute;inset:26px;border-radius:50%;
    background:var(--bg-base);border:2px solid var(--accent-stranger);
    display:flex;align-items:center;justify-content:center;color:var(--accent-stranger);
  }
  .voice-waveform{display:flex;align-items:flex-end;gap:5px;height:30px;}
  .voice-waveform span{
    width:4px;border-radius:3px;background:var(--accent-stranger);
    display:block;height:24px;transform-origin:bottom center;
    transform:scaleY(.3);transition:transform .08s ease;
  }

  .text-mode-note{
    min-height:110px;display:flex;align-items:center;justify-content:center;
    text-align:center;background:var(--bg-surface);border:1px solid var(--border-subtle);
    border-radius:16px;padding:22px;margin-bottom:16px;color:var(--text-muted);font-size:13px;
  }
  .text-mode-note[hidden]{display:none;}

  .layout{display:flex;flex-direction:column;gap:16px;}

  .videos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .videos[hidden]{display:none;}
  .video-tile{position:relative;}
  video{width:100%;background:#000;border-radius:12px;aspect-ratio:4/3;object-fit:cover;display:block;}
  .video-label{
    position:absolute;bottom:8px;left:8px;
    background:rgba(0,0,0,.6);color:var(--text-primary);
    font-size:11px;padding:2px 9px;border-radius:100px;
  }
  #localVideo{border:2px solid var(--accent-you);}
  #remoteVideo{border:2px solid var(--accent-stranger);}

  .controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .controls button{display:inline-flex;align-items:center;gap:6px;}
  button{
    border:none;border-radius:100px;padding:10px 20px;font-weight:600;
    font-size:14px;cursor:pointer;font-family:inherit;
    transition:filter .12s ease,transform .08s ease;
  }
  button:hover:not(:disabled){filter:brightness(1.12);}
  button:active:not(:disabled){transform:scale(.97);}
  button:focus-visible{outline:2px solid var(--accent-you);outline-offset:2px;}
  #startBtn{background:var(--accent-you);color:#1a0b0e;box-shadow:0 4px 14px rgba(255,92,122,.28);}
  #skipBtn{background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-subtle);}
  #reportBtn{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  button:disabled{opacity:.4;cursor:not-allowed;}

  .chat{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:12px;padding:10px;display:flex;flex-direction:column;}
  #chatLog{height:200px;overflow-y:auto;margin-bottom:8px;display:flex;flex-direction:column;gap:8px;padding:2px;}
  .msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.45;}
  .msg.you{align-self:flex-end;background:var(--accent-you-dim);border:1px solid var(--accent-you);border-bottom-right-radius:4px;}
  .msg.stranger{align-self:flex-start;background:var(--accent-stranger-dim);border:1px solid var(--accent-stranger);border-bottom-left-radius:4px;}
  .msg.system{align-self:center;color:var(--text-muted);font-size:11.5px;font-style:italic;text-align:center;max-width:95%;}
  #chatForm{display:flex;gap:8px;}
  #sendBtn{
    width:38px;height:38px;padding:0;flex:0 0 auto;border-radius:50%;
    background:var(--accent-you);color:#1a0b0e;
    display:flex;align-items:center;justify-content:center;
  }
  #chatInput{
    flex:1;background:var(--bg-base);border:1px solid var(--border-subtle);
    border-radius:100px;padding:8px 14px;color:var(--text-primary);font-family:inherit;
  }
  #chatInput:focus{outline:2px solid var(--accent-you);outline-offset:1px;}

  .age-gate{
    position:fixed;inset:0;background:rgba(6,6,8,.9);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .age-gate[hidden]{display:none;}
  .age-gate-card{
    background:var(--bg-surface);border:1px solid var(--border-subtle);
    border-radius:14px;padding:22px;max-width:360px;text-align:center;
  }
  .age-gate-card h2{
    font-family:'Fraunces',serif;font-style:italic;font-weight:500;
    margin:0 0 8px;font-size:19px;
  }
  .age-gate-card p{color:var(--text-muted);font-size:13px;margin:0 0 16px;line-height:1.5;}

  .report-panel{
    background:var(--bg-surface);border:1px solid var(--border-subtle);
    border-radius:12px;padding:12px;margin-bottom:16px;
  }
  .reason-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .reason-row{
    display:flex;align-items:center;gap:10px;width:100%;
    background:var(--bg-base);border:1px solid var(--border-subtle);
    border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500;
    color:var(--text-primary);text-align:left;
  }
  .reason-row .radio-dot{
    width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text-muted);
    flex:0 0 auto;position:relative;
  }
  .reason-row.selected{border-color:var(--accent-you);}
  .reason-row.selected .radio-dot{border-color:var(--accent-you);}
  .reason-row.selected .radio-dot::after{
    content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent-you);
  }
  .report-actions{display:flex;gap:8px;}
  #reportSubmitBtn{background:var(--danger);color:#fff;}
  #reportCancelBtn{background:transparent;color:var(--text-muted);border:1px solid var(--border-subtle);}
  /* Tablet and up: video+controls beside chat instead of stacked */
  @media (min-width:700px){
    .page{max-width:900px;padding:28px;}
    .layout{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:start;}
    .chat-col{position:sticky;top:24px;}
    #chatLog{height:380px;}
  }

  /* Desktop: a bit more room to breathe */
  @media (min-width:1100px){
    .page{max-width:1080px;}
    .videos{gap:16px;}
    #chatLog{height:460px;}
  }
</style>
</head>
<body>
  <div class="age-gate" id="ageGate">
    <div class="age-gate-card">
      <h2>Before you start</h2>
      <p>One4One is for adults only. By continuing, you confirm you're 18 years or older. This is a self-check only — it isn't real ID verification yet.</p>
      <button id="ageConfirmBtn">I'm 18 or older — continue</button>
    </div>
  </div>

  <div class="page">
    <div class="app-header">
      <h1 class="logo">One4One</h1>
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status" id="status" role="status" aria-live="polite">Press start to test the connection</span>
      </div>
    </div>

    <div class="mode-select" id="modeSelect">
      <button type="button" class="mode-btn" data-mode="text">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Text
      </button>
      <button type="button" class="mode-btn selected" data-mode="video">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8.5 16 12l6 3.5z"/></svg>
        Video
      </button>
      <button type="button" class="mode-btn" data-mode="voice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>
        Voice
      </button>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <div class="layout">
      <div class="main-col">
        <div class="videos" id="videos">
          <div class="video-tile">
            <video id="localVideo" autoplay playsinline muted aria-label="Your camera"></video>
            <span class="video-label">You</span>
          </div>
          <div class="video-tile">
            <video id="remoteVideo" autoplay playsinline aria-label="Stranger's camera"></video>
            <span class="video-label">Stranger</span>
          </div>
        </div>

        <div class="voice-ui" id="voiceUi" hidden>
          <div class="voice-avatar-wrap">
            <div class="pulse-ring"></div>
            <div class="pulse-ring delay"></div>
            <div class="voice-avatar">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
            </div>
          </div>
          <div class="voice-waveform" id="voiceWaveform">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="text-mode-note" id="textModeNote" hidden>
          No camera or microphone needed for text mode — just say hi in the chat.
        </div>

        <div class="controls">
          <button id="startBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Start
          </button>
          <button id="skipBtn" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4v16l10-8z"/><path d="M17 4v16"/></svg>
            Skip
          </button>
          <button id="reportBtn" disabled>Report</button>
        </div>
        <div class="report-panel" id="reportPanel" hidden>
          <div class="reason-list" id="reasonList" role="radiogroup" aria-label="Report reason">
            <button type="button" class="reason-row selected" data-value="inappropriate_content" role="radio" aria-checked="true">
              <span class="radio-dot"></span> Inappropriate content
            </button>
            <button type="button" class="reason-row" data-value="harassment" role="radio" aria-checked="false">
              <span class="radio-dot"></span> Harassment
            </button>
            <button type="button" class="reason-row" data-value="underage" role="radio" aria-checked="false">
              <span class="radio-dot"></span> Appears underage
            </button>
            <button type="button" class="reason-row" data-value="spam_bot" role="radio" aria-checked="false">
              <span class="radio-dot"></span> Spam or bot
            </button>
            <button type="button" class="reason-row" data-value="other" role="radio" aria-checked="false">
              <span class="radio-dot"></span> Something else
            </button>
          </div>
          <div class="report-actions">
            <button id="reportSubmitBtn">Submit report</button>
            <button id="reportCancelBtn">Cancel</button>
          </div>
        </div>
      </div>

      <div class="chat-col">
        <div class="chat">
          <div id="chatLog" aria-live="polite" aria-relevant="additions"></div>
          <form id="chatForm">
            <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off">
            <button type="submit" id="sendBtn" aria-label="Send message">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
